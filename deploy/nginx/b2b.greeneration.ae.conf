# Host nginx in front of the server (alternative to Caddy): forwards b2b.greeneration.ae to the portal.
#   /auth/*  → login service 127.0.0.1:8089;  /live/* → only with a valid session (auth_request);  rest → portal-web 127.0.0.1:8088
# HTTPS: after copying this file run  sudo certbot --nginx -d b2b.greeneration.ae  (adds the 443 block and redirect).
server {
    listen 80;
    listen [::]:80;
    server_name b2b.greeneration.ae;

    server_tokens off;
    client_max_body_size 5m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /auth/ {
        proxy_pass http://127.0.0.1:8089;
    }

    location = /_portal_auth_check {
        internal;
        proxy_pass http://127.0.0.1:8089/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /live/ {
        auth_request /_portal_auth_check;
        proxy_pass http://127.0.0.1:8088;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
    }
}
