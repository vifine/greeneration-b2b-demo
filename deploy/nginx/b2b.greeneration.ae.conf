# Host nginx in front of the server: forwards b2b.greeneration.ae to the portal-web container.
# Password is asked by portal-web (basic auth, /etc/greeneration-portal/htpasswd), so nothing to add here.
# HTTPS: after copying this file run  sudo certbot --nginx -d b2b.greeneration.ae  (adds the 443 block and redirect).
server {
    listen 80;
    listen [::]:80;
    server_name b2b.greeneration.ae;

    server_tokens off;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

