# nginx config inside the portal-web container. Password for every page (basic auth).
server {
    listen 80;
    server_name _;
    root /srv/portal/current;
    index index.html;

    auth_basic "Greeneration portal";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    autoindex off;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health check for monitoring (no password, no data).
    location = /healthz { auth_basic off; access_log off; return 200 "ok\n"; }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Live data: always fresh.
    location /live/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /robots.txt { auth_basic off; return 200 "User-agent: *\nDisallow: /\n"; }

    # SPA (HashRouter): everything else serves index.html, never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
