# nginx config inside the portal-web container. Listens on 127.0.0.1 only, behind Caddy.
# No password here: Caddy asks the auth service (forward_auth /auth/check) before /live/* (the real data).
# The page and JS bundle (demo data only) stay public so the portal's own login page can render.
server {
    listen 80;
    server_name _;
    root /srv/portal/current;
    index index.html;

    autoindex off;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health check for monitoring (no data).
    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Live data: always fresh.
    location /live/ {
        add_header Cache-Control "no-cache, private" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }

    # SPA (HashRouter): everything else serves index.html, never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
