# Small nginx container that serves the built portal with a password.
# Listens only on 127.0.0.1; the existing HTTPS proxy (nginx / Caddy / Traefik) forwards b2b.greeneration.ae here.
services:
  portal-web:
    image: nginx:1.27-alpine
    container_name: greeneration-portal-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8088}:80"
    volumes:
      - /var/www/greeneration-portal:/srv/portal:ro
      - /etc/greeneration-portal/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/greeneration-portal/htpasswd:/etc/nginx/htpasswd:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
