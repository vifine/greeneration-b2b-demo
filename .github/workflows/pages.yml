name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh live data from Greeneration's Google Sheets every hour (07:00–23:00 Dubai).
  schedule:
    - cron: '7 3-19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Keyless Google auth: GitHub OIDC → Workload Identity Federation → service account claude-sheets (read-only use).
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/231319851044/locations/global/workloadIdentityPools/github/providers/github
          service_account: claude-sheets@vifine-personal.iam.gserviceaccount.com
      - name: Sync live data from Google Sheets
        run: |
          pip install --quiet google-auth requests
          python scripts/sync_sheets.py
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
