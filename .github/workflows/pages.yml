name: Close the public GitHub Pages copy

# The portal moved to its own server with login (b2b.greeneration.ae).
# This workflow only publishes a "moved" page with no data, so the old public URL shows nothing.
# No data sync and no schedule here any more. To remove the site completely: Settings → Pages → Unpublish.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', 'deploy/pages-closed/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the 'moved' page
        run: |
          mkdir site
          cp deploy/pages-closed/index.html site/
          cp public/CNAME site/
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
